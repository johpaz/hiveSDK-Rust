[workspace]
resolver = "3"
members = ["crates/hive-core", "crates/hive-napi", "crates/hive-python", "crates/hive-gateway"]
default-members = ["crates/hive-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
hive-agent-core = { path = "crates/hive-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = "symbols"
