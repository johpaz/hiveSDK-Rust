name: Native packages
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            compatibility: '2_28'
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
          - key: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            compatibility: '2_28'
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
          - key: linux-x64-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            compatibility: 'musllinux_1_2'
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
            rustflags: '-C target-feature=-crt-static'
          - key: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            compatibility: 'off'
          - key: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            compatibility: 'off'
          - key: win32-x64-msvc
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            compatibility: 'off'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Host toolchain for pinned notice inventory
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Verify notice inventory before packaging
        run: |
          cargo fetch --locked
          python scripts/third-party-notices.py --check
      - name: Native host Node binding
        if: runner.os != 'Linux'
        run: |
          cargo build --release --locked -p hive-agent-napi --target '${{ matrix.target }}'
      - name: Build wheels and Linux Node binding
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.16.0'
          rust-toolchain: '1.100.0'
          working-directory: packages/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.compatibility }}
          container: ${{ matrix.container || 'off' }}
          docker-options: --env RUSTFLAGS
          before-script-linux: cargo build --release --locked -p hive-agent-napi --target '${{ matrix.target }}'
          args: --release --locked -i ${{ runner.os == 'Linux' && 'python3.10' || 'python' }} --out ../../dist/wheels
      - name: Package Node binding
        run: |
          node scripts/package-native.mjs --target '${{ matrix.key }}'
          cd 'dist/npm/${{ matrix.key }}'
          npm pack --pack-destination ..
      - name: Package Node facade
        working-directory: packages/npm
        run: npm pack --pack-destination ../../dist/npm
      - name: Node 24 installed consumer
        if: matrix.key != 'linux-x64-musl'
        run: node scripts/test-npm-install.mjs dist/npm/*.tgz
      - uses: actions/setup-node@v6
        if: matrix.key != 'linux-x64-musl'
        with:
          node-version: '26'
      - name: Node 26 installed consumer
        if: matrix.key != 'linux-x64-musl'
        run: node scripts/test-npm-install.mjs dist/npm/*.tgz
      - name: Musl Node consumers without Rust
        if: matrix.key == 'linux-x64-musl'
        run: |
          for version in 24 26; do
            docker run --rm -v "$PWD:/work:ro" -w /work "node:$version-alpine" sh -c 'node scripts/test-npm-install.mjs dist/npm/*.tgz'
          done
      - name: Linux Python consumers without Rust
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/io:ro" -w /io '${{ matrix.container }}' bash -c '
            for version in 310 315; do
              /opt/python/cp$version-cp$version/bin/python -m venv /tmp/consumer-$version
              /tmp/consumer-$version/bin/python -m pip install --no-index --no-deps /io/dist/wheels/*.whl
              PATH=/tmp/consumer-$version/bin /tmp/consumer-$version/bin/python -I /io/tests/installed-smoke.py
            done'
      - name: Host Python 3.10 installed consumer
        if: runner.os != 'Linux'
        run: python scripts/test-python-install.py dist/wheels/*.whl
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: '3.15'
      - name: Host Python 3.15 installed consumer
        if: runner.os != 'Linux'
        run: python scripts/test-python-install.py dist/wheels/*.whl
      - name: Save tested artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.key }}
          if-no-files-found: error
          path: |
            dist/npm/*.tgz
            dist/wheels/*.whl
