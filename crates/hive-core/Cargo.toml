[package]
name = "hive-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable Rust agent engine for Hive SDK"

[features]
default = []
harness = []
scheduler = ["harness", "dep:chrono", "dep:chrono-tz"]
services = ["dep:serde_yaml", "dep:zeroize"]
browser = ["dep:tokio-tungstenite", "dep:futures-util"]
tools = ["dep:miniz_oxide", "dep:aes", "dep:cbc", "dep:md5"]
# Decode/transform/encode PNG, JPEG, GIF (first frame) and WebP (lossless output).
images = ["dep:image_codec"]
# Screenshots and input for the desktop: X11 (x11rb) and, for Wayland, the xdg desktop portals
# (zbus). Off by default; Linux only for now (other platforms report that they are unsupported).
computer-use = ["tools", "images", "dep:x11rb", "dep:zbus", "dep:futures-util", "dep:windows-sys", "dep:core-graphics"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
hivedb-core = { git = "https://github.com/johpaz/hive-db.git", rev = "10fcd921d79872db881914f2e3f45bb3c20ed917" }
uuid = { version = "1", features = ["v4"] }
jsonschema = { version = "0.58", default-features = false, features = ["idna"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tiktoken-rs = { version = "=0.12.1", default-features = false }
ring = "0.17"
serde_yaml = { version = "0.9.34", optional = true }
tokio-tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }

chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
chrono-tz = { version = "0.9", optional = true }

zeroize = { version = "1", optional = true }
image_codec = { package = "image", version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"], optional = true }
# PDF standard security handler (reading encrypted PDFs).
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true, features = ["alloc"] }
md5 = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
image_codec = { package = "image", version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tokio = { version = "1", features = ["net", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true, default-features = false, features = ["xtest"] }
zbus = { version = "4.4", optional = true }

# Theoretical backends: written against the documented APIs and type-checked for their targets, never run.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", optional = true, features = ["highsierra"] }
