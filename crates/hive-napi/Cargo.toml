[package]
name = "hive-agent-napi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
hive-agent-core = { workspace = true, features = ["services", "browser", "harness", "scheduler", "tools", "images", "computer-use"] }
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt"] }
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
